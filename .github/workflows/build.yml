name: Build H-IDE

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch: { }

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble debug APK
        run: ./gradlew :core:app:assembleDebug --stacktrace

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v5
        with:
          name: h-ide-arm64-v8a-debug
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v5
        with:
          name: h-ide-armeabi-v7a-debug
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
